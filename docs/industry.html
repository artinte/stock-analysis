<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>中证行业分类</title>

    <!-- SheetJS：浏览器直接读取 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f7fa;
            color: #1f2937;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: 24px;
        }

        /* =========================
           顶部
           ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #111827;
        }

        .subtitle {
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
        }

        /* =========================
           控制区域
           ========================= */

        .toolbar {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;

            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .button {
            border: none;
            border-radius: 7px;
            padding: 9px 16px;
            cursor: pointer;

            font-size: 14px;
            font-weight: 500;

            background: #2563eb;
            color: white;

            transition: 0.15s;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .button.secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .button.secondary:hover {
            background: #e5e7eb;
        }

        #folderInput {
            display: none;
        }

        .folder-info {
            color: #6b7280;
            font-size: 13px;
            margin-left: 5px;
        }

        /* =========================
           Excel 文件选择
           ========================= */

        .file-selector {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-selector select {
            min-width: 300px;
        }

        select,
        input[type="text"] {
            height: 38px;
            border: 1px solid #d1d5db;
            border-radius: 7px;

            padding: 0 12px;

            background: #ffffff;
            color: #374151;

            font-size: 14px;

            outline: none;
        }

        select:focus,
        input[type="text"]:focus {
            border-color: #2563eb;
        }

        /* =========================
           筛选区域
           ========================= */

        .filters {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;

            padding: 16px;

            display: grid;

            grid-template-columns:
                minmax(240px, 2fr)
                repeat(4, minmax(160px, 1fr));

            gap: 10px;

            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
        }

        /* =========================
           数据统计
           ========================= */

        .stats {
            display: flex;
            align-items: center;

            gap: 20px;

            margin-bottom: 10px;

            color: #6b7280;
            font-size: 13px;
        }

        .stats strong {
            color: #111827;
        }

        /* =========================
           表格
           ========================= */

        .table-container {
            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 10px;

            overflow: auto;

            max-height: calc(100vh - 300px);

            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.03);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;

            min-width: 1100px;

            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: #f8fafc;

            border-bottom: 1px solid #dfe3e8;

            color: #374151;

            font-weight: 600;

            padding: 12px 14px;

            text-align: left;

            white-space: nowrap;

            cursor: pointer;

            user-select: none;
        }

        th:hover {
            background: #f1f5f9;
        }

        td {
            padding: 11px 14px;

            border-bottom: 1px solid #f0f2f5;

            white-space: nowrap;

            color: #374151;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .symbol {
            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-weight: 600;

            color: #111827;
        }

        .name {
            font-weight: 500;
            color: #111827;
        }

        .industry-level-1 {
            color: #1d4ed8;
            font-weight: 600;
        }

        .industry-level-2 {
            color: #047857;
        }

        .industry-level-3 {
            color: #7c3aed;
        }

        .industry-level-4 {
            color: #b45309;
        }

        /* =========================
           空数据
           ========================= */

        .empty {
            padding: 80px 20px;

            text-align: center;

            color: #9ca3af;

            font-size: 14px;
        }

        .empty-title {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        /* =========================
           Loading
           ========================= */

        .loading {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(255, 255, 255, 0.75);

            z-index: 1000;

            align-items: center;
            justify-content: center;
        }

        .loading.show {
            display: flex;
        }

        .loading-box {
            background: white;

            padding: 25px 40px;

            border-radius: 10px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);

            color: #374151;
        }

        /* =========================
           Toast
           ========================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            background: #111827;
            color: white;

            padding: 10px 18px;

            border-radius: 7px;

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            transition: opacity 0.2s;

            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
        }

        /* =========================
           分页
           ========================= */

        .pagination {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 14px 0;
        }

        .page-info {
            color: #6b7280;
            font-size: 13px;
        }

        .page-buttons {
            display: flex;
            gap: 5px;
        }

        .page-button {
            min-width: 34px;
            height: 34px;

            border: 1px solid #d1d5db;
            background: white;

            border-radius: 6px;

            cursor: pointer;

            color: #374151;
        }

        .page-button:hover {
            background: #f3f4f6;
        }

        .page-button.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .page-button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        /* =========================
           响应式
           ========================= */

        @media (max-width: 1100px) {

            .filters {
                grid-template-columns:
                    1fr
                    1fr
                    1fr;
            }

            .file-selector {
                width: 100%;
                margin-left: 0;
            }

            .file-selector select {
                width: 100%;
            }
        }

        @media (max-width: 700px) {

            .container {
                padding: 12px;
            }

            .title {
                font-size: 21px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         标题
         ========================= -->

    <div class="header">

        <div>
            <div class="title">
                中证行业分类
            </div>

            <div class="subtitle">
                CSIndex Industry Classification
            </div>
        </div>

    </div>


    <!-- =========================
         工具栏
         ========================= -->

    <div class="toolbar">

        <label
            for="folderInput"
            class="button"
        >
            选择 Excel 目录
        </label>

        <input
            id="folderInput"
            type="file"
            webkitdirectory
            multiple
        >

        <button
            id="clearButton"
            class="button secondary"
        >
            清空
        </button>

        <span
            id="folderInfo"
            class="folder-info"
        >
            尚未选择目录
        </span>

        <div class="file-selector">

            <span>
                数据文件：
            </span>

            <select id="fileSelect">
                <option value="">
                    请先选择目录
                </option>
            </select>

        </div>

    </div>


    <!-- =========================
         筛选
         ========================= -->

    <div class="filters">

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="搜索证券代码、简称、行业名称..."
            >

        </div>


        <select id="level1Select">
            <option value="">全部一级行业</option>
        </select>


        <select id="level2Select">
            <option value="">全部二级行业</option>
        </select>


        <select id="level3Select">
            <option value="">全部三级行业</option>
        </select>


        <select id="level4Select">
            <option value="">全部四级行业</option>
        </select>

    </div>


    <!-- =========================
         数据统计
         ========================= -->

    <div class="stats">

        <span>
            数据：
            <strong id="totalCount">0</strong>
        </span>

        <span>
            当前显示：
            <strong id="visibleCount">0</strong>
        </span>

    </div>


    <!-- =========================
         表格
         ========================= -->

    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th data-field="证券代码">
                    证券代码
                </th>

                <th data-field="证券简称">
                    证券简称
                </th>

                <th data-field="中证一级行业分类简称">
                    一级行业
                </th>

                <th data-field="中证二级行业分类简称">
                    二级行业
                </th>

                <th data-field="中证三级行业分类简称">
                    三级行业
                </th>

                <th data-field="中证四级行业分类简称">
                    四级行业
                </th>

            </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>


        <div
            id="empty"
            class="empty"
        >

            <div class="empty-title">
                暂无数据
            </div>

            <div>
                请先选择包含 Excel 文件的目录
            </div>

        </div>

    </div>


    <!-- =========================
         分页
         ========================= -->

    <div class="pagination">

        <div
            id="pageInfo"
            class="page-info"
        >
            -
        </div>

        <div
            id="pageButtons"
            class="page-buttons"
        >
        </div>

    </div>

</div>


<!-- Loading -->

<div
    id="loading"
    class="loading"
>

    <div class="loading-box">
        正在读取 Excel...
    </div>

</div>


<!-- Toast -->

<div
    id="toast"
    class="toast"
>
</div>


<script>

    /* =========================================================
       全局状态
       ========================================================= */

    let allRows = [];

    let filteredRows = [];

    let excelFiles = [];

    let currentFileIndex = -1;

    let currentPage = 1;

    const pageSize = 50;

    let sortField = "";

    let sortDirection = 1;


    /* =========================================================
       Excel 字段
       ========================================================= */

    const FIELDS = {

        symbol: "证券代码",

        name: "证券简称",

        level1: "中证一级行业分类简称",

        level2: "中证二级行业分类简称",

        level3: "中证三级行业分类简称",

        level4: "中证四级行业分类简称"

    };


    /* =========================================================
       DOM
       ========================================================= */

    const folderInput =
        document.getElementById("folderInput");

    const folderInfo =
        document.getElementById("folderInfo");

    const fileSelect =
        document.getElementById("fileSelect");

    const clearButton =
        document.getElementById("clearButton");

    const searchInput =
        document.getElementById("searchInput");

    const level1Select =
        document.getElementById("level1Select");

    const level2Select =
        document.getElementById("level2Select");

    const level3Select =
        document.getElementById("level3Select");

    const level4Select =
        document.getElementById("level4Select");

    const tableBody =
        document.getElementById("tableBody");

    const empty =
        document.getElementById("empty");

    const totalCount =
        document.getElementById("totalCount");

    const visibleCount =
        document.getElementById("visibleCount");

    const pageInfo =
        document.getElementById("pageInfo");

    const pageButtons =
        document.getElementById("pageButtons");

    const loading =
        document.getElementById("loading");

    const toast =
        document.getElementById("toast");


    /* =========================================================
       选择目录
       ========================================================= */

    folderInput.addEventListener(
        "change",
        async function () {

            const files =
                Array.from(this.files);

            /*
             * 只保留 Excel
             */

            excelFiles =
                files.filter(file => {

                    const name =
                        file.name.toLowerCase();

                    return (
                        name.endsWith(".xlsx") ||
                        name.endsWith(".xls")
                    );

                });


            if (excelFiles.length === 0) {

                showToast(
                    "选择的目录中没有 Excel 文件"
                );

                clearAll();

                return;
            }


            /*
             * 按文件最后修改时间倒序
             *
             * 最新文件放第一位
             */

            excelFiles.sort(
                (a, b) =>
                    b.lastModified - a.lastModified
            );


            /*
             * 显示目录信息
             */

            const firstFile =
                files[0];

            let folderName =
                "已选择目录";


            if (
                firstFile.webkitRelativePath
            ) {

                folderName =
                    firstFile
                        .webkitRelativePath
                        .split("/")[0];

            }


            folderInfo.textContent =
                `${folderName} · 找到 ${excelFiles.length} 个 Excel 文件`;


            /*
             * 填充 Excel 文件选择器
             */

            fileSelect.innerHTML = "";


            excelFiles.forEach(
                (file, index) => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value = index;

                    option.textContent =
                        `${file.name} · ${formatDate(file.lastModified)}`;

                    fileSelect.appendChild(
                        option
                    );

                }
            );


            /*
             * 默认加载最新文件
             */

            currentFileIndex = 0;

            fileSelect.value = "0";

            await loadExcel(
                excelFiles[0]
            );

        }
    );


    /* =========================================================
       切换 Excel
       ========================================================= */

    fileSelect.addEventListener(
        "change",
        async function () {

            const index =
                Number(this.value);

            if (
                Number.isNaN(index) ||
                !excelFiles[index]
            ) {
                return;
            }

            currentFileIndex = index;

            await loadExcel(
                excelFiles[index]
            );

        }
    );


    /* =========================================================
       加载 Excel
       ========================================================= */

    async function loadExcel(file) {

        showLoading(true);

        try {

            /*
             * 读取文件二进制
             */

            const buffer =
                await file.arrayBuffer();


            /*
             * SheetJS 解析 Excel
             */

            const workbook =
                XLSX.read(
                    buffer,
                    {
                        type: "array"
                    }
                );


            if (
                !workbook.SheetNames.length
            ) {

                throw new Error(
                    "Excel 中没有工作表"
                );

            }


            /*
             * 默认读取第一张 Sheet
             */

            const sheetName =
                workbook.SheetNames[0];

            const sheet =
                workbook.Sheets[sheetName];


            /*
             * 转成 JSON
             */

            allRows =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        defval: ""
                    }
                );


            /*
             * 标准化数据
             */

            allRows =
                allRows.map(row => {

                    return {

                        [FIELDS.symbol]:
                            cleanValue(
                                row[FIELDS.symbol]
                            ),

                        [FIELDS.name]:
                            cleanValue(
                                row[FIELDS.name]
                            ),

                        [FIELDS.level1]:
                            cleanValue(
                                row[FIELDS.level1]
                            ),

                        [FIELDS.level2]:
                            cleanValue(
                                row[FIELDS.level2]
                            ),

                        [FIELDS.level3]:
                            cleanValue(
                                row[FIELDS.level3]
                            ),

                        [FIELDS.level4]:
                            cleanValue(
                                row[FIELDS.level4]
                            )

                    };

                });


            /*
             * 删除完全没有证券代码的行
             */

            allRows =
                allRows.filter(row =>
                    row[FIELDS.symbol] !== ""
                );


            /*
             * 初始化筛选器
             */

            resetFilters();


            /*
             * 显示数据
             */

            applyFilters();


            showToast(
                `已加载：${file.name}`
            );

        }
        catch (error) {

            console.error(error);

            showToast(
                "Excel 读取失败：" +
                error.message
            );

            allRows = [];

            applyFilters();

        }
        finally {

            showLoading(false);

        }

    }


    /* =========================================================
       数据清洗
       ========================================================= */

    function cleanValue(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }


        /*
         * Excel 中股票代码有可能被识别成数字
         *
         * 例如：
         * 1
         * 600519
         *
         * 这里统一转成字符串
         */

        if (
            typeof value === "number"
        ) {

            return String(
                Math.trunc(value)
            ).padStart(6, "0");

        }


        return String(value).trim();

    }


    /* =========================================================
       筛选
       ========================================================= */

    searchInput.addEventListener(
        "input",
        function () {

            currentPage = 1;

            applyFilters();

        }
    );


    level1Select.addEventListener(
        "change",
        function () {

            currentPage = 1;

            updateDependentFilters();

            applyFilters();

        }
    );


    level2Select.addEventListener(
        "change",
        function () {

            currentPage = 1;

            updateDependentFilters();

            applyFilters();

        }
    );


    level3Select.addEventListener(
        "change",
        function () {

            currentPage = 1;

            updateDependentFilters();

            applyFilters();

        }
    );


    level4Select.addEventListener(
        "change",
        function () {

            currentPage = 1;

            applyFilters();

        }
    );


    /* =========================================================
       执行筛选
       ========================================================= */

    function applyFilters() {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();


        const l1 =
            level1Select.value;

        const l2 =
            level2Select.value;

        const l3 =
            level3Select.value;

        const l4 =
            level4Select.value;


        filteredRows =
            allRows.filter(row => {

                /*
                 * 关键词搜索
                 */

                if (keyword) {

                    const text =
                        [

                            row[FIELDS.symbol],

                            row[FIELDS.name],

                            row[FIELDS.level1],

                            row[FIELDS.level2],

                            row[FIELDS.level3],

                            row[FIELDS.level4]

                        ]
                        .join(" ")
                        .toLowerCase();


                    if (
                        !text.includes(keyword)
                    ) {
                        return false;
                    }

                }


                /*
                 * 一级行业
                 */

                if (
                    l1 &&
                    row[FIELDS.level1] !== l1
                ) {
                    return false;
                }


                /*
                 * 二级行业
                 */

                if (
                    l2 &&
                    row[FIELDS.level2] !== l2
                ) {
                    return false;
                }


                /*
                 * 三级行业
                 */

                if (
                    l3 &&
                    row[FIELDS.level3] !== l3
                ) {
                    return false;
                }


                /*
                 * 四级行业
                 */

                if (
                    l4 &&
                    row[FIELDS.level4] !== l4
                ) {
                    return false;
                }


                return true;

            });


        /*
         * 排序
         */

        if (sortField) {

            filteredRows.sort(
                (a, b) => {

                    const av =
                        String(
                            a[sortField] ?? ""
                        );

                    const bv =
                        String(
                            b[sortField] ?? ""
                        );


                    return (
                        av.localeCompare(
                            bv,
                            "zh-CN"
                        ) * sortDirection
                    );

                }
            );

        }


        totalCount.textContent =
            allRows.length.toLocaleString();


        visibleCount.textContent =
            filteredRows.length.toLocaleString();


        renderTable();

        renderPagination();

    }


    /* =========================================================
       初始化筛选器
       ========================================================= */

    function resetFilters() {

        fillSelect(
            level1Select,
            uniqueValues(
                allRows,
                FIELDS.level1
            ),
            "全部一级行业"
        );


        fillSelect(
            level2Select,
            uniqueValues(
                allRows,
                FIELDS.level2
            ),
            "全部二级行业"
        );


        fillSelect(
            level3Select,
            uniqueValues(
                allRows,
                FIELDS.level3
            ),
            "全部三级行业"
        );


        fillSelect(
            level4Select,
            uniqueValues(
                allRows,
                FIELDS.level4
            ),
            "全部四级行业"
        );

    }


    /* =========================================================
       联动筛选器
       ========================================================= */

    function updateDependentFilters() {

        const l1 =
            level1Select.value;

        const l2 =
            level2Select.value;

        const l3 =
            level3Select.value;


        /*
         * 二级
         */

        let rows2 =
            allRows;


        if (l1) {

            rows2 =
                rows2.filter(
                    row =>
                        row[FIELDS.level1] === l1
                );

        }


        fillSelect(
            level2Select,
            uniqueValues(
                rows2,
                FIELDS.level2
            ),
            "全部二级行业",
            level2Select.value
        );


        /*
         * 三级
         */

        let rows3 =
            rows2;


        if (l2) {

            rows3 =
                rows3.filter(
                    row =>
                        row[FIELDS.level2] === l2
                );

        }


        fillSelect(
            level3Select,
            uniqueValues(
                rows3,
                FIELDS.level3
            ),
            "全部三级行业",
            level3Select.value
        );


        /*
         * 四级
         */

        let rows4 =
            rows3;


        if (l3) {

            rows4 =
                rows4.filter(
                    row =>
                        row[FIELDS.level3] === l3
                );

        }


        fillSelect(
            level4Select,
            uniqueValues(
                rows4,
                FIELDS.level4
            ),
            "全部四级行业",
            level4Select.value
        );

    }


    /* =========================================================
       获取唯一值
       ========================================================= */

    function uniqueValues(
        rows,
        field
    ) {

        return [
            ...new Set(

                rows
                    .map(row => row[field])
                    .filter(Boolean)

            )
        ].sort(
            (a, b) =>
                String(a).localeCompare(
                    String(b),
                    "zh-CN"
                )
        );

    }


    /* =========================================================
       填充 Select
       ========================================================= */

    function fillSelect(
        select,
        values,
        defaultText,
        currentValue = ""
    ) {

        select.innerHTML = "";


        const defaultOption =
            document.createElement(
                "option"
            );

        defaultOption.value = "";

        defaultOption.textContent =
            defaultText;

        select.appendChild(
            defaultOption
        );


        values.forEach(value => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = value;

            option.textContent = value;

            select.appendChild(
                option
            );

        });


        /*
         * 尽量保留原来的选择
         */

        if (
            currentValue &&
            values.includes(currentValue)
        ) {

            select.value =
                currentValue;

        }
        else {

            select.value = "";

        }

    }


    /* =========================================================
       表格渲染
       ========================================================= */

    function renderTable() {

        tableBody.innerHTML = "";


        if (
            filteredRows.length === 0
        ) {

            empty.style.display =
                "block";

            return;

        }


        empty.style.display =
            "none";


        const start =
            (currentPage - 1) *
            pageSize;


        const end =
            start + pageSize;


        const rows =
            filteredRows.slice(
                start,
                end
            );


        const fragment =
            document.createDocumentFragment();


        rows.forEach(row => {

            const tr =
                document.createElement("tr");


            /*
             * 证券代码
             */

            addCell(
                tr,
                row[FIELDS.symbol],
                "symbol"
            );


            /*
             * 证券简称
             */

            addCell(
                tr,
                row[FIELDS.name],
                "name"
            );


            /*
             * 一级行业
             */

            addCell(
                tr,
                row[FIELDS.level1],
                "industry-level-1"
            );


            /*
             * 二级行业
             */

            addCell(
                tr,
                row[FIELDS.level2],
                "industry-level-2"
            );


            /*
             * 三级行业
             */

            addCell(
                tr,
                row[FIELDS.level3],
                "industry-level-3"
            );


            /*
             * 四级行业
             */

            addCell(
                tr,
                row[FIELDS.level4],
                "industry-level-4"
            );


            fragment.appendChild(tr);

        });


        tableBody.appendChild(
            fragment
        );

    }


    /* =========================================================
       添加单元格
       ========================================================= */

    function addCell(
        tr,
        value,
        className
    ) {

        const td =
            document.createElement("td");

        td.textContent =
            value || "-";


        if (className) {

            td.classList.add(
                className
            );

        }


        /*
         * 点击复制
         */

        td.title =
            "点击复制";


        td.style.cursor =
            "copy";


        td.addEventListener(
            "click",
            async function () {

                try {

                    await navigator.clipboard.writeText(
                        value || ""
                    );

                    showToast(
                        "已复制：" +
                        (value || "")
                    );

                }
                catch {

                    showToast(
                        "复制失败"
                    );

                }

            }
        );


        tr.appendChild(td);

    }


    /* =========================================================
       分页
       ========================================================= */

    function renderPagination() {

        pageButtons.innerHTML = "";


        const totalPages =
            Math.ceil(
                filteredRows.length /
                pageSize
            );


        if (
            totalPages <= 1
        ) {

            pageInfo.textContent =
                filteredRows.length > 0
                    ? `共 ${filteredRows.length} 条`
                    : "-";

            return;

        }


        pageInfo.textContent =
            `第 ${currentPage} / ${totalPages} 页，共 ${filteredRows.length.toLocaleString()} 条`;


        /*
         * 上一页
         */

        const prev =
            createPageButton(
                "上一页"
            );

        prev.disabled =
            currentPage === 1;

        prev.onclick = () => {

            if (
                currentPage > 1
            ) {

                currentPage--;

                renderTable();

                renderPagination();

            }

        };

        pageButtons.appendChild(prev);


        /*
         * 页码
         */

        const maxButtons = 7;

        let start =
            Math.max(
                1,
                currentPage -
                Math.floor(maxButtons / 2)
            );


        let end =
            Math.min(
                totalPages,
                start + maxButtons - 1
            );


        if (
            end - start <
            maxButtons - 1
        ) {

            start =
                Math.max(
                    1,
                    end - maxButtons + 1
                );

        }


        for (
            let i = start;
            i <= end;
            i++
        ) {

            const button =
                createPageButton(
                    String(i)
                );


            if (
                i === currentPage
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.onclick = () => {

                currentPage = i;

                renderTable();

                renderPagination();

            };


            pageButtons.appendChild(
                button
            );

        }


        /*
         * 下一页
         */

        const next =
            createPageButton(
                "下一页"
            );


        next.disabled =
            currentPage === totalPages;


        next.onclick = () => {

            if (
                currentPage < totalPages
            ) {

                currentPage++;

                renderTable();

                renderPagination();

            }

        };


        pageButtons.appendChild(next);

    }


    /* =========================================================
       创建分页按钮
       ========================================================= */

    function createPageButton(
        text
    ) {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "page-button";

        button.textContent =
            text;

        return button;

    }


    /* =========================================================
       表头排序
       ========================================================= */

    document
        .querySelectorAll("th[data-field]")
        .forEach(th => {

            th.addEventListener(
                "click",
                function () {

                    const field =
                        this.dataset.field;


                    if (
                        sortField === field
                    ) {

                        sortDirection *= -1;

                    }
                    else {

                        sortField =
                            field;

                        sortDirection =
                            1;

                    }


                    applyFilters();

                }
            );

        });


    /* =========================================================
       清空
       ========================================================= */

    clearButton.addEventListener(
        "click",
        function () {

            clearAll();

        }
    );


    function clearAll() {

        allRows = [];

        filteredRows = [];

        excelFiles = [];

        currentFileIndex = -1;

        currentPage = 1;

        sortField = "";

        sortDirection = 1;


        folderInput.value = "";

        folderInfo.textContent =
            "尚未选择目录";


        fileSelect.innerHTML =
            `<option value="">
                请先选择目录
            </option>`;


        searchInput.value = "";


        fillSelect(
            level1Select,
            [],
            "全部一级行业"
        );

        fillSelect(
            level2Select,
            [],
            "全部二级行业"
        );

        fillSelect(
            level3Select,
            [],
            "全部三级行业"
        );

        fillSelect(
            level4Select,
            [],
            "全部四级行业"
        );


        totalCount.textContent =
            "0";

        visibleCount.textContent =
            "0";


        tableBody.innerHTML = "";

        empty.style.display =
            "block";


        pageButtons.innerHTML = "";

        pageInfo.textContent =
            "-";

    }


    /* =========================================================
       Loading
       ========================================================= */

    function showLoading(show) {

        if (show) {

            loading.classList.add(
                "show"
            );

        }
        else {

            loading.classList.remove(
                "show"
            );

        }

    }


    /* =========================================================
       Toast
       ========================================================= */

    let toastTimer = null;


    function showToast(message) {

        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(
                () => {

                    toast.classList.remove(
                        "show"
                    );

                },
                2000
            );

    }


    /* =========================================================
       日期格式
       ========================================================= */

    function formatDate(timestamp) {

        const date =
            new Date(timestamp);


        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                date.getDate()
            ).padStart(2, "0");


        const hour =
            String(
                date.getHours()
            ).padStart(2, "0");


        const minute =
            String(
                date.getMinutes()
            ).padStart(2, "0");


        return (
            `${year}-${month}-${day} ` +
            `${hour}:${minute}`
        );

    }


</script>
